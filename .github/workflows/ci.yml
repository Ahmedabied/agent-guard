name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test,sdk,http,otel]'
          # For the test that runs agent-otel and agent-guard in one trace. A tag, so its main cannot break this one.
          pip install 'agent-otel @ git+https://github.com/Ahmedabied/agent-otel@v0.2.0'
      - name: Tests
        run: pytest -q
      - name: Example policy regression cases
        run: agent-guard test -p examples/guard.yaml examples/guard-tests.yaml
      - name: HTTP gateway demo
        run: python examples/http_demo.py
      - name: Benchmark smoke run
        run: |
          python bench/bench.py --calls 300
          python bench/bench_http.py --calls 300

  ts-clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test,sdk,http,otel]'
          npm install --prefix tests/ts --no-audit --no-fund --ignore-scripts
      - name: TypeScript SDK clients and the reference server through the guard
        env:
          AG_REQUIRE_TS: "1"
        run: pytest -q tests/test_ts_clients.py tests/test_reference_server.py

  jaeger:
    # The HTTP demo traced end to end, sent to a real Jaeger, read back from its API and checked.
    runs-on: ubuntu-latest
    env:
      JAEGER_VERSION: "2.23.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[http,sdk,otel]'
      - name: Start Jaeger (release binary, checksum verified)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v$JAEGER_VERSION" -R jaegertracing/jaeger -D /tmp/jaeger \
            -p "jaeger-$JAEGER_VERSION-linux-amd64.tar.gz" -p "jaeger-$JAEGER_VERSION-linux-amd64.sha256sum.txt"
          cd /tmp/jaeger && tar -xzf "jaeger-$JAEGER_VERSION-linux-amd64.tar.gz"
          grep "/jaeger$" "jaeger-$JAEGER_VERSION-linux-amd64.sha256sum.txt" | sed 's/ \*/  /' | sha256sum -c -
          nohup "./jaeger-$JAEGER_VERSION-linux-amd64/jaeger" > jaeger.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:16686/ > /dev/null && break; sleep 1; done
      - name: Traced demo, then the traces read back
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318
        run: |
          python examples/http_demo.py
          sleep 2
          python examples/jaeger_check.py
