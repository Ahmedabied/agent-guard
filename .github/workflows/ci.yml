name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test,sdk,http]'
      - name: Tests
        run: pytest -q
      - name: Example policy regression cases
        run: agent-guard test -p examples/guard.yaml examples/guard-tests.yaml
      - name: Benchmark smoke run
        run: |
          python bench/bench.py --calls 300
          python bench/bench_http.py --calls 300

  ts-clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test,sdk,http]'
          npm install --prefix tests/ts --no-audit --no-fund
      - name: TypeScript SDK clients through the gateway
        env:
          AG_REQUIRE_TS: "1"
        run: pytest -q tests/test_ts_clients.py
